name: Autoblog DeepSeek
on:
  schedule: [{cron: "0 2 * * *"}]
  workflow_dispatch:
    inputs:
      judul: {description: "Judul (kosongkan = ambil antrean)", required: false}
      kategori: {description: "Kategori", default: "", required: false}
jobs:
  tulis:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Tulis artikel
        run: python3 scripts/autoblog.py --judul "$JUDUL" --kategori "$KATEGORI"
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          JUDUL: ${{ inputs.judul }}
          KATEGORI: ${{ inputs.kategori }}
      - name: Commit dan push
        run: |
          git config user.name "autoblog" && git config user.email "autoblog@users.noreply.github.com"
          git add content
          git diff --quiet || (git commit -m "Autoblog: artikel baru" && git push)
